services:
  autobonding:
    build: .
    image: autobonding:latest
    container_name: autobonding-monitor
    gpus:
    - driver: nvidia
      device_ids: ["GPU-513ee291-66e6-a843-78f1-4db548001091"]
      capabilities: [gpu]
    shm_size: "8gb"
    volumes:
      - ./application/data:/workspace/application/data
      - ./application/data_debug:/workspace/application/data_debug
      - ./run_monitor.sh:/workspace/run_monitor.sh
      - ./run_monitor_debug.sh:/workspace/run_monitor_debug.sh
    environment:
      - PYTHONPATH=/workspace
      - DISPLAY=:99
      # Non-GUI matplotlib backend: with DISPLAY set, matplotlib would otherwise
      # pick QtAgg, whose closed figures are never freed (no Qt event loop) and
      # leak ~400 MB per patient.
      - MPLBACKEND=Agg
      - API_TOKEN=${API_TOKEN}
      # --- application/monitor.py flags, see README.md for details ---
      - CHECK_INTERVAL=${CHECK_INTERVAL:-5}
      - REMESH=${REMESH:-false}
      - CACHE=${CACHE:-false}
      - SAVE_PLY=${SAVE_PLY:-false}
      - VIS_SEG=${VIS_SEG:-true}
      - WORKERS=${WORKERS:-1}
      - LANDMARKS=${LANDMARKS:-}
      - PREPROCESSING=${PREPROCESSING:-/workspace/preprocessing/production_preprocessing.yaml}
    command: bash /workspace/run_monitor.sh
